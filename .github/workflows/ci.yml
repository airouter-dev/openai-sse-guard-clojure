name: Clojure CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['11', '17', '21']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: leiningen
      - name: Install Leiningen
        run: curl -fsSL https://raw.githubusercontent.com/technomancy/leiningen/stable/bin/lein > "$RUNNER_TEMP/lein" && chmod +x "$RUNNER_TEMP/lein" && echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: lein test
      - run: lein pom
